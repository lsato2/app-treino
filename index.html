<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Full Body</title>
<meta name="description" content="Treinos full body A, B e C com registro de cargas e timer de descanso.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #20242d;
    --line: #2c313c;
    --text: #eef0f4;
    --muted: #9aa1ad;
    --accent: #3ddc97;
    --accent-ink: #06291a;
    --a: #3ddc97;
    --b: #5aa9ff;
    --c: #ffb547;
    --danger: #ff6b6b;
    --radius: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-top: var(--safe-t);
    padding-bottom: calc(76px + var(--safe-b));
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 8px 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 24px 0 12px; letter-spacing: -0.01em; }
  h3 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .tag {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px; font-weight: 800; font-size: 18px;
    color: #0b0d10; flex: none;
  }
  .tag.A { background: var(--a); } .tag.B { background: var(--b); } .tag.C { background: var(--c); }
  .btn {
    display: block; width: 100%; padding: 15px 18px; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; text-align: center;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid #4a2a2e; }
  .btn:active { transform: scale(.98); }
  .hero { padding: 20px; background: linear-gradient(160deg, #1d2a24, var(--surface) 70%); }
  .hero.B { background: linear-gradient(160deg, #1b2534, var(--surface) 70%); }
  .hero.C { background: linear-gradient(160deg, #2e2619, var(--surface) 70%); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .ex-list { list-style: none; padding: 0; margin: 12px 0 0; }
  .ex-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .ex-list li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Sessão */
  .session-head {
    position: sticky; top: 0; z-index: 5; background: rgba(15,17,21,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(10px + var(--safe-t)) 16px 10px; margin-top: calc(-1 * var(--safe-t));
    border-bottom: 1px solid var(--line);
  }
  .session-head .inner { max-width: 560px; margin: 0 auto; }
  .progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .ex { padding: 0; overflow: hidden; }
  .ex-top { padding: 16px; }
  .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .tip { font-size: 14px; color: var(--muted); margin-top: 10px; display: none; }
  .ex.open .tip { display: block; }
  .tip-toggle { font-size: 13px; color: var(--b); margin-top: 8px; padding: 0; }
  .sets { border-top: 1px solid var(--line); }
  .set {
    display: grid; grid-template-columns: 34px 1fr 1fr 52px; gap: 8px; align-items: center;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
  }
  .set:last-child { border-bottom: 0; }
  .set-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 10px; padding-bottom: 4px; }
  .set .n { color: var(--muted); font-weight: 700; text-align: center; }
  .set input {
    width: 100%; min-width: 0; padding: 10px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--line); text-align: center; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .set input:focus { outline: 2px solid var(--b); outline-offset: -1px; }
  .check {
    width: 44px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
    display: grid; place-items: center; justify-self: end;
  }
  .check svg { width: 20px; height: 20px; stroke: var(--muted); }
  .set.done { background: rgba(61,220,151,.07); }
  .set.done .check { background: var(--accent); border-color: var(--accent); }
  .set.done .check svg { stroke: var(--accent-ink); }
  .last { font-size: 12px; color: var(--muted); }

  /* Timer de descanso */
  .rest {
    position: fixed; left: 12px; right: 12px; bottom: calc(84px + var(--safe-b)); z-index: 20;
    max-width: 536px; margin: 0 auto; background: #232833; border: 1px solid #3a4150; border-radius: 18px;
    padding: 12px 14px; display: none; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .rest.show { display: flex; }
  .rest .time { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 82px; }
  .rest .lbl { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.3; }
  .rest button { padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .rest.over .time { color: var(--accent); }

  /* Navegação */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(15,17,21,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
  }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav.tabs button { padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { color: var(--accent); }

  .hist-item .row { align-items: flex-start; }
  .hist-sets { font-size: 13px; color: var(--muted); margin-top: 8px; display: none; }
  .hist-item.open .hist-sets { display: block; }
  .hist-sets div { padding: 3px 0; }
  .empty { text-align: center; padding: 32px 16px; color: var(--muted); }
  .field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .field:first-child { border-top: 0; }
  .field input { padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); text-align: center; width: 100%; }
  .kv { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kv:first-child { border-top: 0; }
  .kv b { font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; color: var(--muted); }
  .hidden { display: none !important; }
  .tcell { display: flex; gap: 6px; min-width: 0; }
  .tcell input { flex: 1; }
  .play { width: 40px; flex: none; border-radius: 10px; background: var(--b); display: grid; place-items: center; }
  .play svg { width: 18px; height: 18px; fill: #06182b; }
  .set.timed { grid-template-columns: 34px 0.8fr 1.4fr 52px; }
  .set.running { background: rgba(90,169,255,.10); }
  .set.running .play { background: var(--danger); }
  .set.running input[data-f="reps"] { color: var(--b); font-weight: 800; }
  .set.running.hit input[data-f="reps"] { color: var(--accent); }
  .set.done .play { opacity: .35; }
  .cardio.off .cardio-body { display: none; }
  .cardio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .cardio-grid label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  .cardio-grid input, .cardio-grid select { width: 100%; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); font-size: 16px; }
  .switch { width: 50px; height: 30px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: .2s; }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { left: 23px; background: #fff; }
  .del-btn { margin-top: 12px; padding: 8px 12px; border-radius: 10px; font-size: 14px; color: var(--danger); border: 1px solid #4a2a2e; }
  .stack > * + * { margin-top: 10px; }

  /* Sessão: sem menu inferior, botões de topo */
  body.in-session { padding-bottom: var(--safe-b); }
  body.in-session nav.tabs { display: none; }
  body.in-session .rest { bottom: calc(12px + var(--safe-b)); }
  body.has-rest .wrap { padding-bottom: 120px; }
  .hbtn { padding: 10px 12px; min-height: 44px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 15px; white-space: nowrap; }
  .hbtn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .need, .stepper.need input { outline: 2px solid var(--danger) !important; outline-offset: -1px; }
  .set input { padding: 11px 8px; }
  .check { height: 44px; }

  /* Modo Foco */
  .focus { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: calc(100vh - 92px - var(--safe-t) - var(--safe-b)); min-height: calc(100dvh - 92px - var(--safe-t) - var(--safe-b)); }
  .f-top { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 6px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-name { font-size: 30px; margin: 6px 0 6px; }
  .f-meta { color: var(--muted); font-size: 16px; }
  .f-meta b { color: var(--text); }
  .dots { display: flex; gap: 6px; margin: 14px 0 12px; }
  .dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
  .dots i.done { background: var(--accent); }
  .dots i.cur { background: var(--b); }
  .f-last { font-size: 14px; color: var(--muted); }
  .focus .tip { margin-top: 8px; }
  .focus .tip.show { display: block; }
  .stepper { display: grid; grid-template-columns: 68px 1fr 68px; gap: 10px; align-items: center; margin-top: 18px; }
  .stepper button { height: 68px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); font-size: 30px; font-weight: 600; }
  .stepper button:active { background: var(--line); }
  .stepper .val { display: grid; text-align: center; }
  .stepper input { width: 100%; background: transparent; border: 0; border-radius: 12px; text-align: center; font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 0; color: var(--text); }
  .stepper input:focus { outline: 2px solid var(--b); }
  .stepper .u { font-size: 13px; color: var(--muted); }
  .f-cta { margin-top: auto; padding-top: 20px; }
  .btn.xl { padding: 20px; font-size: 20px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn.xl svg { width: 24px; height: 24px; stroke: currentColor; fill: none; }
  .play-xl svg, .play-xl.stop svg { fill: currentColor; stroke: none; }
  .play-xl { background: var(--b); color: #06182b; }
  .play-xl.stop { background: var(--danger); color: #2b0606; }
  .f-nav { display: grid; grid-template-columns: 1fr auto 1fr; margin-top: 8px; }
  .f-nav button { padding: 14px 4px; color: var(--muted); font-size: 15px; min-height: 44px; }
  .f-nav button:first-child { text-align: left; } .f-nav button:last-child { text-align: right; }
  .f-nav button:disabled { opacity: .3; }
  .big-clock { font-size: 96px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; margin: 28px 0 10px; }
  .big-clock.run { color: var(--b); } .big-clock.hit { color: var(--accent); } .big-clock.count { color: var(--c); }
  .rest-screen .big-clock { font-size: 112px; margin-top: 36px; }
  .rest-track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 6px 0 18px; }
  .rest-track i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
  .adj { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .next-card { margin-top: 16px; }
  .next-card b { display: block; margin-top: 2px; }
  .swapped { font-size: 13px; color: var(--c); margin-top: -2px; }
  .sug { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.35; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .sug b { color: var(--text); font-size: 13px; }
  .sug.up { background: rgba(61,220,151,.09); border-color: rgba(61,220,151,.35); }
  .sug.up b { color: var(--accent); }
  .sug .hbtn { flex: none; background: var(--accent); color: var(--accent-ink); border: 0; }
  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 10px 16px calc(16px + var(--safe-b)); }
  .sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .opt { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 12px 14px; min-height: 56px; margin-top: 8px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .opt.on { border-color: var(--accent); }
  .opt svg { width: 22px; height: 22px; stroke: var(--accent); flex: none; }
  .opt .pill { font-size: 11px; padding: 2px 7px; }
  .remember { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .remember input { width: 20px; height: 20px; accent-color: var(--accent); }
  .skipped-card { opacity: .6; }
  .ord-row { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .ord-row:first-child { border-top: 0; }
  .ord-row.done { opacity: .55; }
  .ord-n { color: var(--muted); font-weight: 700; text-align: center; }
  .ord-name { font-size: 15px; }
  .ord-row .hbtn { min-width: 44px; min-height: 44px; }
  .ord-row .hbtn:disabled { opacity: .3; }
  .stat .dl { display: block; margin-top: 4px; }
  .dl { font-size: 12px; font-weight: 700; }
  .dl.up { color: var(--accent); } .dl.down { color: var(--danger); } .dl.eq { color: var(--muted); }
  .pr-card { border-color: rgba(255,181,71,.45); background: rgba(255,181,71,.07); }
  .pr-card b { color: var(--c); text-align: right; }
  .pr-card .kv { gap: 12px; }
  .cmp-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .cmp-row:first-child { border-top: 0; padding-top: 0; }
  .cmp-name { font-size: 14px; color: var(--muted); }
  .cmp-vals { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 2px; }
  .backup-card { border-color: rgba(90,169,255,.45); background: rgba(90,169,255,.07); margin-top: 12px; }
  .sum-btn { color: var(--b); border-color: rgba(90,169,255,.4); }
  .done-ico { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; margin: 24px auto 4px; }
  @media (max-height: 740px) {
    .f-top { margin-top: 0; }
    .f-name { font-size: 24px; margin: 4px 0; }
    .f-meta { font-size: 14px; }
    .dots { margin: 10px 0 8px; }
    .stepper { grid-template-columns: 58px 1fr 58px; margin-top: 10px; }
    .stepper button { height: 56px; font-size: 26px; }
    .stepper input { font-size: 34px; }
    .f-cta { padding-top: 12px; }
    .btn.xl { padding: 16px; font-size: 18px; }
    .f-nav button { padding: 10px 4px; }
    .big-clock { font-size: 76px; margin: 18px 0 8px; }
    .rest-screen .big-clock { font-size: 88px; margin-top: 20px; }
  }
  .done-ico svg { width: 36px; height: 36px; stroke: var(--accent-ink); }
</style>
</head>
<body>

<div id="app"></div>

<div class="rest" id="rest" role="status" aria-live="polite">
  <div class="time" id="restTime">0:00</div>
  <div class="lbl" id="restLbl">Descanso</div>
  <button id="restMinus">−15s</button>
  <button id="restPlus">+15s</button>
  <button id="restSkip">Pular</button>
</div>

<nav class="tabs" id="tabs">
  <div class="inner">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Início</button>
    <button data-tab="plans"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Treinos</button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
  </div>
</nav>

<script>
/* ============================================================
   PLANO DE TREINO — 3 treinos full body, 6 exercícios cada
   A: Força (cargas altas, poucas repetições)
   B: Hipertrofia (volume moderado)
   C: Resistência / condicionamento (repetições altas, descanso curto)
   ============================================================ */
const PLANS = {
  A: {
    name: 'Treino A', focus: 'Força',
    desc: 'Movimentos básicos com cargas mais altas e descanso maior.',
    exercises: [
      { id: 'agachamento', name: 'Agachamento livre com barra', muscles: 'Quadríceps, glúteos, core', sets: 4, reps: '6–8', rest: 120, step: 5,
        tip: 'Pés na largura dos ombros, desça até a coxa ficar paralela ao chão mantendo a coluna neutra e os joelhos alinhados com a ponta dos pés.' },
      { id: 'supino-reto', name: 'Supino reto com barra', muscles: 'Peitoral, tríceps, ombro anterior', sets: 4, reps: '6–8', rest: 120,
        tip: 'Escápulas retraídas e pés firmes no chão. Desça a barra até a linha do peito, com cotovelos a ~45° do tronco.' },
      { id: 'remada-curvada', name: 'Remada curvada com barra', muscles: 'Dorsais, trapézio, bíceps', sets: 4, reps: '6–8', rest: 120,
        tip: 'Tronco inclinado a ~45°, coluna neutra. Puxe a barra em direção ao umbigo, apertando as escápulas.' },
      { id: 'desenvolvimento', name: 'Desenvolvimento com halteres', muscles: 'Ombros, tríceps', sets: 3, reps: '8–10', rest: 90, step: 2,
        tip: 'Sentado com encosto, empurre os halteres acima da cabeça sem arquear a lombar.' },
      { id: 'stiff', name: 'Stiff com barra', muscles: 'Posteriores de coxa, glúteos, lombar', sets: 3, reps: '8–10', rest: 90,
        tip: 'Joelhos levemente flexionados, leve o quadril para trás e desça a barra rente às pernas até sentir alongar o posterior.' },
      { id: 'prancha', name: 'Prancha abdominal', muscles: 'Core', sets: 3, reps: '40s', rest: 60, unit: 's',

/* Exercício efetivo de cada posição do treino, considerando trocas (swaps: { índice: idAlternativa }) */
function slotEx(plan, ei, swaps) {
  const base = PLANS[plan].exercises[ei];
  const altId = swaps && swaps[ei];
  const alt = altId && (ALTS[base.id] || []).find(x => x.id === altId);
  if (!alt) return base;
  const { unit, dist, assist, bodyweight, step, ...core } = base;   // flags do original não passam para o substituto
  return { ...core, ...alt, base };
}
function exList(x) { return PLANS[x.plan].exercises.map((_, i) => slotEx(x.plan, i, x.swaps)); }
function prefSwaps(plan) {
  const out = {}; const pref = S.prefSwaps || {};
  PLANS[plan].exercises.forEach((e, i) => { if (pref[e.id] && (ALTS[e.id] || []).some(x => x.id === pref[e.id])) out[i] = pref[e.id]; });
  return out;
}
function newSets(e) {
  const last = S.last[e.id] || {};
  return Array.from({ length: e.sets }, () => ({ kg: last.kg ?? null, reps: null, done: false }));
}

/* ============================================================
   PROGRESSÃO — dupla progressão: ao completar todas as séries
   no topo da faixa, sobe a carga; senão, mantém e busca +reps
   ============================================================ */
function lastSessionSets(id) {
  for (let k = S.history.length - 1; k >= 0; k--) {
    const ss = (S.history[k].sets[id] || []).filter(s => s.done);
    if (ss.length) return ss;
  }
  return null;
}
function repRange(e) {
  const n = (String(e.reps).match(/\d+/g) || []).map(Number);
  if (!n.length) return null;
  return { lo: n[0], hi: /\d\s*[–-]\s*\d/.test(e.reps) ? n[1] : n[0] };
}
function suggestion(e) {
  const ss = lastSessionSets(e.id); if (!ss) return null;
  const m = metric(e); const list = ss.map(s => s.reps ?? '–').join(', ');
  const full = ss.length >= e.sets; const step = e.step || 2.5;
  if (m === 'dist') return null;
  if (e.assist) {
    const kg = Math.max(...ss.map(s => s.kg || 0));
    if (full && kg > 0 && ss.every(s => (s.reps || 0) >= 8))
      return { type: 'up', kg: Math.max(0, kg - step), text: `Você fez ${list} repetições com ${fmtKg(kg)} kg de contrapeso. Reduza o contrapeso para ${fmtKg(Math.max(0, kg - step))} kg.` };
    return null;
  }
  const r = repRange(e); if (!r) return null;
  if (m === 'time') {
    if (full && ss.every(s => (s.reps || 0) >= r.lo)) return { type: 'up', text: `Você segurou ${list} s. Tente ${r.lo + 10} s em cada série hoje.` };
    return { type: 'keep', text: `Na última vez: ${list} s. Busque ${r.lo} s em todas as séries.` };
  }
  if (e.bodyweight && !ss.some(s => s.kg)) {
    if (full && ss.every(s => (s.reps || 0) >= r.hi)) return { type: 'up', text: `Você fez ${list} repetições, todas no topo da faixa. Dificulte: desça mais devagar (3 s) ou acrescente carga.` };
    return { type: 'keep', text: `Na última vez: ${list} repetições. Busque ${r.hi} em todas as séries.` };
  }
  const kg = Math.max(...ss.map(s => s.kg || 0)); if (!kg) return null;
  const atKg = ss.filter(s => s.kg === kg);
  if (full && atKg.length === ss.length && ss.every(s => (s.reps || 0) >= r.hi)) {
    const nkg = Math.round((kg + step) * 100) / 100;
    return { type: 'up', kg: nkg, text: `Na última vez: ${fmtKg(kg)} kg × ${list}, todas no topo da faixa (${r.hi}). Suba para ${fmtKg(nkg)} kg.` };
  }
  if (ss.some(s => (s.reps || 0) < r.lo)) return { type: 'keep', kg, text: `Na última vez: ${fmtKg(kg)} kg × ${list}. Mantenha ${fmtKg(kg)} kg até fazer pelo menos ${r.lo} em todas as séries.` };
  return { type: 'keep', kg, text: `Na última vez: ${fmtKg(kg)} kg × ${list}. Mantenha ${fmtKg(kg)} kg e busque ${r.hi} repetições em todas.` };
}
function sugCard(e, a, compact) {
  const sg = suggestion(e); if (!sg) return '';
  const pending = a ? a.sets[e.id].filter(s => !s.done) : [];
  const canApply = sg.kg != null && pending.length && pending.some(s => s.kg !== sg.kg);
  return `<div class="sug ${sg.type}${compact ? ' compact' : ''}">
    <div><b>${sg.type === 'up' ? '↑ Hora de progredir' : 'Meta de hoje'}</b><div>${esc(sg.text)}</div></div>
    ${canApply ? `<button class="hbtn small" data-apply="${e.id}" data-kg="${sg.kg}">Usar ${fmtKg(sg.kg)} kg</button>` : ''}
  </div>`;
}

function openSwap(ei) {
  const a = S.active; const base = PLANS[a.plan].exercises[ei]; const cur = slotEx(a.plan, ei, a.swaps);
  const opts = [{ ...base, isBase: true }, ...(ALTS[base.id] || []).map(x => slotEx(a.plan, ei, { [ei]: x.id }))];
  const fixed = (S.prefSwaps || {})[base.id];
  const el = document.createElement('div'); el.className = 'sheet-bg';
  el.innerHTML = `<div class="sheet" role="dialog" aria-label="Trocar exercício">
    <div class="sheet-grip"></div>
    <h3>Trocar exercício</h3>
    <p class="muted small" style="margin:4px 0 12px">Aparelho ocupado ou indisponível? Escolha uma alternativa para os mesmos músculos.</p>
    ${opts.map(o => `<button class="opt ${o.id === cur.id ? 'on' : ''}" data-alt="${o.isBase ? '' : o.id}">
        <span><b>${esc(o.name)}</b>${o.isBase ? ' <span class="pill">original</span>' : ''}<br><span class="muted small">${esc(o.muscles)} · ${o.sets} × ${esc(o.reps)}</span></span>
        ${o.id === cur.id ? CHECK : ''}</button>`).join('')}
    <label class="remember"><input type="checkbox" id="swRemember" ${fixed ? 'checked' : ''}> Usar sempre esta escolha no ${PLANS[a.plan].name}</label>
    <button class="btn ghost" id="swCancel" style="margin-top:8px">Cancelar</button>
  </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.onclick = ev => { if (ev.target === el) close(); };
  $('#swCancel', el).onclick = close;
  el.querySelectorAll('[data-alt]').forEach(b => b.onclick = () => {
    const altId = b.dataset.alt || null;
    if (swapExercise(ei, altId, $('#swRemember', el).checked)) { close(); render(); window.scrollTo(0, 0); }
  });
}
function swapExercise(ei, altId, remember) {
  const a = S.active; const old = slotEx(a.plan, ei, a.swaps); const baseId = PLANS[a.plan].exercises[ei].id;
  const changing = (old.id !== (altId || baseId));
  if (changing && (a.sets[old.id] || []).some(s => s.done) && !confirm(`As séries já feitas de ${old.name} serão descartadas. Trocar mesmo assim?`)) return false;
  if (changing) {
    delete a.sets[old.id];
    a.swaps = a.swaps || {};
    if (altId) a.swaps[ei] = altId; else delete a.swaps[ei];
    const ne = slotEx(a.plan, ei, a.swaps);
    a.sets[ne.id] = newSets(ne);
  }
  S.prefSwaps = S.prefSwaps || {};
  if (remember && altId) S.prefSwaps[baseId] = altId; else delete S.prefSwaps[baseId];   // desmarcado = sem troca fixa
  if (sw) stopWatch(false);
  save(); return true;
}


/* Aeróbico opcional ao final do treino */
const CARDIO_TYPES = ['Esteira', 'Bicicleta', 'Elíptico', 'Escada', 'Remo', 'Corda', 'Caminhada/corrida na rua'];

const CARDIO_SUG = {
  A: { min: 20, int: 'Moderado', txt: '15–20 min em ritmo moderado (dá para conversar com alguma dificuldade). Ex.: esteira inclinada ou bicicleta.' },
  B: { min: 20, int: 'Moderado', txt: '15–20 min em ritmo leve a moderado, para não prejudicar a recuperação do treino de hipertrofia.' },
  C: { min: 12, int: 'HIIT (intervalado)', txt: '10–15 min intervalado: 30 s forte + 60 s leve, repetindo de 8 a 10 vezes. Ex.: bicicleta ou remo.' },
};

catch (e) { S = structuredClone(DEFAULT); }

/* ============================== Utilidades ============================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.max(0, sec) % 60).padStart(2, '0')}`;
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

function weekCount() {
  const now = new Date(); const d = new Date(now); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // segunda-feira
  return S.history.filter(h => h.end >= d.getTime()).length;
}
function sessionVolume(h) {
  let v = 0;
  for (const e of exList(h)) {
    if (metric(e) !== 'reps' || e.assist) continue;   // tempo, distância e contrapeso não entram no volume
    for (const s of h.sets[e.id] || []) if (s.done && s.kg && s.reps) v += s.kg * s.reps;
  }
  return Math.round(v);
}

/* ============================== Telas ============================== */
let tab = 'home';
function go(t) { if (sw) stopWatch(false); tab = t; render(); window.scrollTo(0, 0); }

        <div class="row" style="gap:8px"><button class="del-btn sum-btn" data-sum="${h.end}">Ver resumo</button><button class="del-btn" data-del="${h.end}">Excluir este treino</button></div>

function calcProfile() {
  const p = S.profile; const h = p.altura / 100;

/* ============================== Sessão de treino ============================== */
/* Tipo de registro de cada exercício: repetições, tempo (seg) ou distância (m) */
const metric = e => e.unit === 's' ? 'time' : e.dist ? 'dist' : 'reps';
const repsUnit = e => ({ time: 'seg', dist: 'metros', reps: 'reps' })[metric(e)];
const kgUnit = e => e.assist ? 'kg de contrapeso' : 'kg';
const fmtKg = v => v == null || v === '' ? '–' : String(+(+v).toFixed(2)).replace('.', ',');
function fmtSet(e, s) {
  if (!s) return '–';
  const m = metric(e);
  if (m === 'time') return `${s.reps ?? '–'} s${s.kg ? ` · ${fmtKg(s.kg)} kg` : ''}`;
  if (m === 'dist') return `${fmtKg(s.kg)} kg × ${s.reps ?? '–'} m`;
  if (e.bodyweight && !s.kg) return `${s.reps ?? '–'} reps`;
  return `${fmtKg(s.kg)} ${e.assist ? 'kg contrapeso' : 'kg'} × ${s.reps ?? '–'}`;
}
function defaultReps(e) {
  const last = S.last[e.id];
  if (last && last.reps) return last.reps;
  const n = parseInt(e.reps, 10);
  return isNaN(n) ? null : n;
}

function startSession(k) {
  if (S.active && S.active.plan !== k) {
    if (!confirm(`Há um ${PLANS[S.active.plan].name} em andamento. Descartar e iniciar o ${PLANS[k].name}?`)) return;
    S.active = null;
  }
  if (!S.active) {
    const swaps = prefSwaps(k); const sets = {};
    for (const e of exList({ plan: k, swaps })) sets[e.id] = newSets(e);
    S.active = { plan: k, start: Date.now(), sets, swaps, order: PLANS[k].exercises.map((_, i) => i), skipped: {}, cardio: newCardio(k), view: 'focus', cur: 0 };
    save();
  }
  go('session');
}

function newCardio(k) {
  const prev = S.lastCardio || {};
  return { on: false, type: prev.type || 'Esteira', min: CARDIO_SUG[k].min, km: null, int: CARDIO_SUG[k].int };
}

function viewCardio(a) {
  const c = a.cardio; const sug = CARDIO_SUG[a.plan];
  const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  return `<div class="card cardio ${c.on ? '' : 'off'}" id="cardio">
    <div class="row between">
      <div><h3>Aeróbico <span class="muted small" style="font-weight:400">(opcional)</span></h3>

    </div>

        <label>Modalidade<select data-c="type">${opt(CARDIO_TYPES, c.type)}</select></label>
        <label>Intensidade<select data-c="int">${opt(CARDIO_INT, c.int)}</select></label>
        <label>Tempo (min)<input data-c="min" inputmode="numeric" value="${c.min ?? ''}"></label>
        <label>Distância (km, opcional)<input data-c="km" inputmode="decimal" value="${c.km ?? ''}" placeholder="—"></label>

      <button class="btn ghost" id="cardioTimer" style="margin-top:12px">Iniciar cronômetro de ${c.min || 0} min</button>
    </div>

}
function bindCardio(a) {
  if (!$('#cardio')) return;
  $('#cardioSw').onclick = () => {
    a.cardio.on = !a.cardio.on; save();
    $('#cardio').classList.toggle('off', !a.cardio.on);
    $('#cardioSw').classList.toggle('on', a.cardio.on); $('#cardioSw').setAttribute('aria-checked', a.cardio.on);
  };
  document.querySelectorAll('[data-c]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    const f = el.dataset.c; a.cardio[f] = (f === 'min' || f === 'km') ? num(el.value) : el.value;
    if (f === 'min') $('#cardioTimer').textContent = `Iniciar cronômetro de ${a.cardio.min || 0} min`;
    save();
  }));
  $('#cardioTimer').onclick = () => { if (a.cardio.min) startRest(a.cardio.min * 60, `${a.cardio.type} · ${a.cardio.int}`, 'Aeróbico'); };
}

function progressPct() {
  const a = S.active; let t = 0, d = 0;
  exList(a).forEach((e, ei) => { if (isSkipped(a, ei)) return; for (const s of a.sets[e.id] || []) { t++; if (s.done) d++; } });
  return t ? Math.round(d / t * 100) : 0;
}

/* Próxima série pendente: primeiro no exercício atual, depois nos seguintes (dando a volta) */
/* Ordem do treino (pode ser alterada durante a sessão) e exercícios pulados */
function orderOf(a) {
  const n = PLANS[a.plan].exercises.length;
  if (!Array.isArray(a.order) || a.order.length !== n) a.order = Array.from({ length: n }, (_, i) => i);
  return a.order;
}
const posOf = (a, ei) => orderOf(a).indexOf(ei);
const isSkipped = (a, ei) => !!(a.skipped && a.skipped[ei]);

/* Próxima série pendente seguindo a ordem do treino (ignora exercícios pulados) */
function nextPending(a, fromEi) {
  const ex = exList(a); const ord = orderOf(a); const start = Math.max(0, ord.indexOf(fromEi));
  for (let k = 0; k < ord.length; k++) {
    const ei = ord[(start + k) % ord.length];
    if (isSkipped(a, ei)) continue;
    const si = a.sets[ex[ei].id].findIndex(s => !s.done);
    if (si >= 0) return { ei, si };
  }
  return null;
}
function moveLater(ei) {
  const a = S.active; const ord = orderOf(a); const nxt = nextPending(a, ord[(posOf(a, ei) + 1) % ord.length]);
  ord.splice(posOf(a, ei), 1); ord.push(ei);
  a.cur = nxt && nxt.ei !== ei ? nxt.ei : ei; save();
}
function skipToday(ei, on) {
  const a = S.active; a.skipped = a.skipped || {};
  if (on) { a.skipped[ei] = true; const n = nextPending(a, ei); if (n) a.cur = n.ei; }
  else { delete a.skipped[ei]; a.cur = ei; }
  if (sw) stopWatch(false);
  save();
}
function nextLabel(a, pos) {
  if (!pos) return '';
  const e = exList(a)[pos.ei]; const s = a.sets[e.id][pos.si];
  const load = metric(e) === 'time' ? `meta ${e.reps}` : `${s.kg != null ? fmtKg(s.kg) + ' kg · ' : ''}meta ${e.reps}`;
  return `${e.name} · série ${pos.si + 1} de ${e.sets} · ${load}`;
}

/* Conclui uma série (comum aos modos Foco e Lista) */
function completeSet(ei, si) {
  const a = S.active; const e = exList(a)[ei]; const sets = a.sets[e.id]; const s = sets[si];
  s.done = true;
  sets.forEach((o, j) => { if (j > si && !o.done) o.kg = s.kg; });   // repete a carga nas próximas séries
  const nxt = nextPending(a, ei);
  if (nxt) a.cur = nxt.ei;
  save();
  if (navigator.vibrate) navigator.vibrate(30);
  if (nxt) startRest(e.rest, nextLabel(a, nxt));       // sem descanso depois da última série do treino
  else endRest(false);
  return nxt;
}

function viewSession() {
  const a = S.active; const p = PLANS[a.plan];
  if (!a.cardio) a.cardio = newCardio(a.plan);
  if (!a.view) a.view = 'focus';
  if (a.cur == null) { const n = nextPending(a, 0); a.cur = n ? n.ei : 0; }
  const head = `<div class="session-head"><div class="inner">
      <div class="row between">
        <button class="hbtn" id="pauseBtn" aria-label="Pausar e voltar ao início">‹ Pausar</button>
        <div style="text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>${p.name}</b> <span class="muted small">${p.focus}</span><div class="muted small" id="elapsed">${elapsedTxt()}</div></div>
        <button class="hbtn" id="viewBtn">${a.view === 'focus' ? 'Lista' : 'Foco'}</button>
      </div>
      <div class="progress"><i id="prog" style="width:${progressPct()}%"></i></div>
    </div></div>`;
  return head + (a.view === 'focus' ? viewFocus(a) : viewList(a));
}

/* ---------- Modo Foco ---------- */
function viewFocus(a) {
  const ex = exList(a);
  if (rest) {
    const total = Math.max(1, rest.total);
    return `<div class="focus rest-screen">
      <div class="f-top">${esc(rest.title)}</div>
      <div class="big-clock" data-rest-time>${fmtTime(Math.max(0, Math.ceil((rest.end - Date.now()) / 1000)))}</div>
      <div class="rest-track"><i data-rest-bar style="width:${Math.min(100, (rest.end - Date.now()) / total * 100)}%"></i></div>
      <div class="adj"><button class="btn ghost" id="fMinus">−15s</button><button class="btn ghost" id="fPlus">+15s</button></div>
      ${rest.label ? `<div class="card next-card"><div class="muted small">${rest.title === 'Aeróbico' ? 'Atividade' : 'Próximo'}</div><b>${esc(rest.label)}</b></div>` : ''}
      <div class="f-cta"><button class="btn xl" id="fSkip">${rest.title === 'Aeróbico' ? 'Encerrar cronômetro' : 'Pular descanso'}</button></div>
    </div>`;
  }
  if (!nextPending(a, 0)) {
    const n = Object.values(a.sets).flat().filter(s => s.done).length;
    return `<div class="focus">
      <div class="done-ico">${CHECK}</div>
      <h1 style="text-align:center">Musculação concluída!</h1>
      <p class="muted" style="text-align:center;margin-top:0">${n} séries · ${elapsedTxt(true)}</p>
      ${Object.keys(a.skipped || {}).length ? `<p class="note" style="text-align:center">Pulados hoje: ${Object.keys(a.skipped).map(i => esc(ex[i].name)).join(', ')}. Para retomar, use a lista.</p>` : ''}
      ${viewCardio(a)}
      <div class="f-cta stack"><button class="btn xl" id="finishBtn">Finalizar treino</button>
      <button class="btn ghost" id="toList">Revisar séries</button></div>
    </div>`;
  }
  const ei = Math.min(a.cur, ex.length - 1); const e = ex[ei]; const sets = a.sets[e.id];
  const ord = orderOf(a); const pos = posOf(a, ei);
  const si = sets.findIndex(s => !s.done); const m = metric(e);
  const dots = sets.map((s, j) => `<i class="${s.done ? 'done' : j === si ? 'cur' : ''}"></i>`).join('');
  const last = S.last[e.id];
  const nav = `<div class="f-nav">
      <button id="fPrev" ${pos === 0 ? 'disabled' : ''}>‹ Anterior</button>
      <button id="toList">Ver lista</button>
      <button id="fNext" ${pos === ord.length - 1 ? 'disabled' : ''}>Próximo ›</button></div>`;
  const header = `<div class="row between" style="align-items:flex-start;gap:8px">
        <div class="f-top">Exercício ${pos + 1} de ${ord.length} · ${esc(e.muscles)}</div>
        <button class="hbtn small" data-actions="${ei}" aria-label="Opções do exercício">⋯ Opções</button></div>
      <h1 class="f-name">${esc(e.name)}</h1>
      ${e.base ? `<div class="swapped">no lugar de ${esc(e.base.name)}</div>` : ''}`;
  if (isSkipped(a, ei)) {
    return `<div class="focus">${header}
      <div class="f-meta">Pulado hoje</div>
      <p class="note">Este exercício não entra no treino de hoje. Se o aparelho liberou, é só retomar.</p>
      <div class="f-cta stack"><button class="btn xl" data-resume="${ei}">Retomar exercício</button>
      <button class="btn ghost" id="fGoNext">Ir para a próxima série pendente</button>${nav}</div>
    </div>`;
  }
  if (si < 0) {
    return `<div class="focus">${header}
      <div class="f-meta">Exercício concluído ✓</div>
      <div class="dots">${dots}</div>
      <div class="card" style="margin-top:8px">${sets.map((s, j) => `<div class="kv"><span>Série ${j + 1}</span><b>${fmtSet(e, s)}</b></div>`).join('')}</div>
      <div class="f-cta"><button class="btn xl" id="fGoNext">Ir para a próxima série pendente</button>${nav}</div>
    </div>`;
  }
  const s = sets[si];
  const repsVal = s.reps ?? defaultReps(e);
  const step = e.step || (m === 'dist' ? 5 : 2.5);
  const stepper = (f, val, unit, st) => `<div class="stepper" data-f="${f}" data-step="${st}">
      <button data-d="-1" aria-label="Diminuir ${unit}">−</button>
      <label class="val"><input inputmode="decimal" value="${val == null ? '' : String(val).replace('.', ',')}" placeholder="—" aria-label="${unit}"><span class="u">${unit}</span></label>
      <button data-d="1" aria-label="Aumentar ${unit}">+</button></div>`;
  let body;
  if (m === 'time') {
    body = `<div class="big-clock" id="fClock">0:00</div>
      <div class="f-meta" style="text-align:center">meta <b>${esc(e.reps)}</b></div>
      <div class="f-cta"><button class="btn xl play-xl" id="fPlay">${PLAY} Iniciar cronômetro</button>${nav}</div>`;
  } else {
    body = `${e.bodyweight ? '' : stepper('kg', s.kg, kgUnit(e), step)}
      ${stepper('reps', repsVal, repsUnit(e), m === 'dist' ? 5 : 1)}
      ${e.bodyweight ? '<p class="note" style="text-align:center">Peso corporal</p>' : ''}
      <div class="f-cta"><button class="btn xl" id="fDone">${CHECK} Série concluída</button>${nav}</div>`;
  }
  return `<div class="focus">${header}
      <div class="f-meta">Série <b>${si + 1}</b> de ${sets.length} · meta <b>${esc(e.reps)}</b> · descanso ${fmtTime(e.rest)}</div>
      <div class="dots">${dots}</div>
      <div class="f-last">${last ? `Última vez: ${fmtSet(e, last)}` : 'Primeira vez neste exercício'}
        · <button class="tip-toggle" id="fTipBtn" style="margin:0">Como executar</button></div>
      <div class="tip" id="fTip">${esc(e.tip)}</div>
      ${si === 0 ? sugCard(e, a, true) : ''}
      ${body}
    </div>`;
}

function bindFocus(a) {
  const ex = exList(a);
  const rr = () => { render(); window.scrollTo(0, 0); };
  if ($('#toList')) $('#toList').onclick = () => { a.view = 'list'; save(); rr(); };
  const ord = orderOf(a);
  if ($('#fPrev')) $('#fPrev').onclick = () => { a.cur = ord[Math.max(0, posOf(a, a.cur) - 1)]; save(); rr(); };
  if ($('#fNext')) $('#fNext').onclick = () => { a.cur = ord[Math.min(ord.length - 1, posOf(a, a.cur) + 1)]; save(); rr(); };
  if ($('#fGoNext')) $('#fGoNext').onclick = () => { const n = nextPending(a, a.cur); if (n) a.cur = n.ei; save(); rr(); };
  document.querySelectorAll('[data-resume]').forEach(b => b.onclick = () => { skipToday(+b.dataset.resume, false); rr(); });
  if ($('#fTipBtn')) $('#fTipBtn').onclick = () => {
    const t = $('#fTip'); t.classList.toggle('show'); $('#fTipBtn').textContent = t.classList.contains('show') ? 'Ocultar dica' : 'Como executar';

  if ($('#fMinus')) $('#fMinus').onclick = () => adjustRest(-15);
  if ($('#finishBtn')) $('#finishBtn').onclick = finishSession;
  bindCardio(a); bindSwapApply(a);

  const e = ex[a.cur]; if (!e) return;
  const si = a.sets[e.id].findIndex(s => !s.done); if (si < 0) return;
  const s = a.sets[e.id][si];

  document.querySelectorAll('.stepper').forEach(st => {
    const inp = $('input', st); const step = +st.dataset.step;
    st.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const cur = num(inp.value) ?? 0;
      const v = Math.max(0, Math.round((cur + step * +b.dataset.d) * 100) / 100);
      inp.value = String(v).replace('.', ','); st.classList.remove('need');

  if ($('#fDone')) $('#fDone').onclick = () => {

    if (!reps) { rSt.classList.add('need'); $('input', rSt).focus(); return; }   // não grava valor que você não informou
    s.reps = reps; s.kg = kgSt ? num($('input', kgSt).value) : null;
    completeSet(a.cur, si); rr();
  };

  if ($('#fPlay')) {
    const clock = $('#fClock'), btn = $('#fPlay');
    const ui = {
      show(mode, v) {
        clock.classList.toggle('run', mode === 'run'); clock.classList.toggle('hit', mode === 'hit'); clock.classList.toggle('count', mode === 'count');
        clock.textContent = mode === 'count' ? String(v) : mode === 'idle' ? '0:00' : fmtTime(v);
        btn.innerHTML = mode === 'idle' ? `${PLAY} Iniciar cronômetro` : `${STOP} Parar e registrar`;
        btn.classList.toggle('stop', mode !== 'idle');
      }
    };
    btn.onclick = () => {
      if (sw) return stopWatch(true);
      startWatch(s, parseInt(e.reps, 10), () => { completeSet(a.cur, si); rr(); }, ui);
    };
  }
}

/* ---------- Modo Lista ---------- */
function viewList(a) {
  const p = PLANS[a.plan];
  const exs = exList(a);
  const cards = orderOf(a).map((ei, pos) => {
    const e = exs[ei]; const last = S.last[e.id]; const m = metric(e);
    if (isSkipped(a, ei)) return `<div class="card ex skipped-card">
      <div class="ex-top"><div class="row between"><h3>${pos + 1}. ${esc(e.name)}</h3><button class="hbtn small" data-resume="${ei}">Retomar</button></div>

}

function bindList(a) {
  $('#finishBtn').onclick = finishSession;
  bindCardio(a); bindSwapApply(a);
  document.querySelectorAll('[data-resume]').forEach(b => b.onclick = () => { skipToday(+b.dataset.resume, false); a.cur = +b.dataset.resume; render(); });
  $('#discardBtn').onclick = () => { if (confirm('Descartar este treino? Nada será salvo.')) { S.active = null; save(); endRest(false); go('home'); } };
  document.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => { a.view = 'focus'; a.cur = +b.dataset.focus; save(); render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => {
    const c = b.closest('.ex'); c.classList.toggle('open'); b.textContent = c.classList.contains('open') ? 'Ocultar dica' : 'Como executar';
  });
  document.querySelectorAll('.set[data-ex]').forEach(row => {
    const id = row.dataset.ex, ei = +row.dataset.ei, i = +row.dataset.i; const s = a.sets[id][i];
    const ex = exList(a)[ei];
    const repsInp = $('input[data-f="reps"]', row);
    row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
      s[inp.dataset.f] = num(inp.value); inp.classList.remove('need');
      if (inp.dataset.f === 'kg') a.sets[id].forEach((o, j) => {
        if (j > i && !o.done) { o.kg = s.kg; const el = $(`.set[data-ex="${id}"][data-i="${j}"] input[data-f="kg"]`); if (el) el.value = s.kg ?? ''; }
      });
      save();
    }));
    const refresh = () => {
      a.sets[id].forEach((o, j) => { const r = $(`.set[data-ex="${id}"][data-i="${j}"]`); r.classList.toggle('done', o.done); $('input[data-f="kg"]', r).value = o.kg ?? ''; });
      $('#prog').style.width = progressPct() + '%';
    };
    const done = () => {
      if (s.done) { s.done = false; save(); refresh(); return; }
      if (s.reps == null) { repsInp.classList.add('need'); repsInp.focus(); return; }   // não grava valor que você não informou
      completeSet(ei, i); refresh();
    };
    const play = $('[data-play]', row);
    if (play) {
      const ui = {
        show(mode, v) {
          repsInp.value = mode === 'count' ? '' : mode === 'idle' ? (s.reps ?? '') : v;
          repsInp.placeholder = mode === 'count' ? `em ${v}…` : 'seg';
          row.classList.toggle('running', mode !== 'idle'); row.classList.toggle('hit', mode === 'hit');
          play.innerHTML = mode === 'idle' ? PLAY : STOP;
        }
      };
      play.onclick = () => { if (sw) return stopWatch(true); if (!s.done) startWatch(s, parseInt(ex.reps, 10), () => { completeSet(ei, i); refresh(); }, ui); };
    }

  });
}

function sheet(html) {
  const el = document.createElement('div'); el.className = 'sheet-bg';
  el.innerHTML = `<div class="sheet" role="dialog"><div class="sheet-grip"></div>${html}</div>`;
  document.body.appendChild(el);
  el.onclick = ev => { if (ev.target === el) el.remove(); };
  return el;
}
function openActions(ei) {
  const a = S.active; const e = exList(a)[ei]; const sk = isSkipped(a, ei);
  const el = sheet(`<h3>${esc(e.name)}</h3>
    <button class="opt" data-act="swap"><span><b>⇄ Trocar exercício</b><br><span class="muted small">Aparelho ocupado ou indisponível</span></span></button>
    ${sk ? '' : `<button class="opt" data-act="later"><span><b>↓ Fazer depois</b><br><span class="muted small">Move para o fim do treino e segue para o próximo</span></span></button>`}
    <button class="opt" data-act="skip"><span><b>${sk ? '↺ Retomar exercício' : '⤼ Pular hoje'}</b><br><span class="muted small">${sk ? 'Volta a fazer parte do treino de hoje' : 'Não entra no treino de hoje'}</span></span></button>
    <button class="opt" data-act="order"><span><b>⇅ Reordenar treino</b><br><span class="muted small">Mudar a sequência dos exercícios de hoje</span></span></button>
    <button class="btn ghost" data-act="close" style="margin-top:12px">Cancelar</button>`);
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const act = b.dataset.act; el.remove();
    if (act === 'swap') return openSwap(ei);
    if (act === 'order') return openReorder();
    if (act === 'later') moveLater(ei);
    if (act === 'skip') skipToday(ei, !sk);
    if (act !== 'close') { render(); window.scrollTo(0, 0); }

}
function openReorder() {
  const a = S.active; const ex = exList(a);
  const el = sheet(`<h3>Reordenar treino</h3><p class="muted small" style="margin:4px 0 8px">Use as setas para mudar a sequência de hoje.</p><div id="ordList"></div>
    <button class="btn" id="ordDone" style="margin-top:12px">Concluir</button>`);
  const draw = () => {
    const ord = orderOf(a);
    $('#ordList', el).innerHTML = ord.map((ei, pos) => {
      const done = a.sets[ex[ei].id].every(s => s.done);
      return `<div class="ord-row ${done ? 'done' : ''}"><span class="ord-n">${pos + 1}</span>
        <span class="ord-name">${esc(ex[ei].name)}${done ? ' <span class="pill">feito</span>' : isSkipped(a, ei) ? ' <span class="pill">pulado</span>' : ''}</span>
        <button class="hbtn small" data-up="${pos}" ${pos === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button class="hbtn small" data-down="${pos}" ${pos === ord.length - 1 ? 'disabled' : ''} aria-label="Descer">↓</button></div>`;
    }).join('');
    el.querySelectorAll('[data-up],[data-down]').forEach(b => b.onclick = () => {
      const i = +(b.dataset.up ?? b.dataset.down); const j = b.dataset.up != null ? i - 1 : i + 1;
      [ord[i], ord[j]] = [ord[j], ord[i]]; save(); draw();
    });
  };
  draw();
  $('#ordDone', el).onclick = () => { el.remove(); const n = nextPending(a, orderOf(a)[0]); if (n) a.cur = n.ei; save(); render(); window.scrollTo(0, 0); };
}

function bindSwapApply(a) {
  document.querySelectorAll('[data-actions]').forEach(b => b.onclick = () => openActions(+b.dataset.actions));
  document.querySelectorAll('[data-swap]').forEach(b => b.onclick = () => openSwap(+b.dataset.swap));
  document.querySelectorAll('[data-apply]').forEach(b => b.onclick = () => {
    const kg = +b.dataset.kg; (a.sets[b.dataset.apply] || []).forEach(s => { if (!s.done) s.kg = kg; });
    save(); render();
  });
}

function bindSession() {
  const a = S.active;
  $('#pauseBtn').onclick = () => go('home');
  $('#viewBtn').onclick = () => { a.view = a.view === 'focus' ? 'list' : 'focus'; save(); render(); window.scrollTo(0, 0); };
  if (a.view === 'focus') bindFocus(a); else bindList(a);
}

function finishSession() {
  const a = S.active; const doneCount = Object.values(a.sets).flat().filter(s => s.done).length;
  if (!doneCount && !(a.cardio && a.cardio.on) && !confirm('Nenhuma série foi marcada. Finalizar mesmo assim?')) return;
  for (const e of exList(a)) {
    const done = (a.sets[e.id] || []).filter(s => s.done);
    if (!done.length) continue;
    const key = metric(e) === 'reps' ? (s => s.kg ?? 0) : (s => s.reps ?? 0);
    const best = done.reduce((m, s) => key(s) >= key(m) ? s : m, done[0]);
    S.last[e.id] = { kg: best.kg, reps: best.reps };
  }
  const cardio = a.cardio && a.cardio.on && a.cardio.min ? { type: a.cardio.type, min: a.cardio.min, km: a.cardio.km, int: a.cardio.int } : null;
  if (cardio) S.lastCardio = { type: cardio.type };
  const end = Date.now();
  S.history.push({ plan: a.plan, start: a.start, end, sets: a.sets, swaps: a.swaps || {}, skipped: Object.keys(a.skipped || {}).map(Number), cardio });
  S.next = ORDER[(ORDER.indexOf(a.plan) + 1) % 3];
  S.active = null; save(); endRest(false);
  summaryEnd = end; go('summary');
}

/* ============================== Cronômetro de exercício (ex.: prancha) ============================== */
let sw = null; // { s, start, tick, target, hit, onDone, ui }
function tone(freq, dur = 0.15) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); const t = audioCtx.currentTime;
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function startWatch(s, target, onDone, ui) {
  if (sw) stopWatch(false);
  endRest(false);
  sw = { s, target, onDone, ui, hit: false, start: Date.now() + 3000 };   // 3 s para se posicionar
  let lastCount = null;
  const upd = () => {
    const ms = Date.now() - sw.start;
    if (ms < 0) {                    // contagem regressiva 3-2-1
      const c = Math.ceil(-ms / 1000);
      if (c !== lastCount) { lastCount = c; tone(660); }
      ui.show('count', c); return;
    }
    if (lastCount !== 0) { lastCount = 0; tone(990, 0.3); }
    const sec = Math.floor(ms / 1000);
    if (!sw.hit && target && sec >= target) { sw.hit = true; beep(); }
    ui.show(sw.hit ? 'hit' : 'run', sec);
  };
  upd(); sw.tick = setInterval(upd, 200);
  wakeLock(true);
}
function stopWatch(record) {
  if (!sw) return;
  const { s, onDone, tick, ui } = sw; clearInterval(tick); wakeLock(false);
  const sec = Math.max(0, Math.floor((Date.now() - sw.start) / 1000));
  const started = Date.now() >= sw.start; sw = null;
  ui.show('idle');
  if (record && started && sec > 0) { s.reps = sec; save(); if (!s.done) onDone(); }
}
let lock = null;
function wakeLock(on) {
  try {
    if (on && navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {});
    if (!on && lock) { lock.release(); lock = null; }
  } catch (e) {}
}

/* ============================== Timer de descanso ============================== */
let rest = null, restTick = null, audioCtx = null; // rest = { end, total, label, title, beeped }
const inFocus = () => tab === 'session' && S.active && S.active.view === 'focus';
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startRest(sec, label, title = 'Descanso') {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  rest = { end: Date.now() + sec * 1000, total: sec * 1000, label, title, beeped: false };
  clearInterval(restTick); restTick = setInterval(updateRest, 250); updateRest();
  if (inFocus()) { render(); window.scrollTo(0, 0); }
}
function adjustRest(d) {
  if (!rest) return;
  rest.end = Math.max(Date.now() + 1000, rest.end + d * 1000); rest.total = Math.max(rest.total, rest.end - Date.now());
  updateRest();
}
function updateRest() {
  const bar = $('#rest');
  if (!rest) { bar.classList.remove('show'); document.body.classList.remove('has-rest'); return; }
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  const show = !inFocus();
  bar.classList.toggle('show', show); document.body.classList.toggle('has-rest', show);
  $('#restLbl').textContent = rest.beeped ? 'Descanso finalizado. Próxima série!' : (rest.label || rest.title);
  document.querySelectorAll('[data-rest-time], #restTime').forEach(el => el.textContent = fmtTime(Math.max(0, left)));
  document.querySelectorAll('[data-rest-bar]').forEach(el => el.style.width = Math.max(0, (rest.end - Date.now()) / rest.total * 100) + '%');
  if (left <= 0 && !rest.beeped) {
    rest.beeped = true; beep(); bar.classList.add('over');
    if (inFocus()) endRest(true); else setTimeout(() => { if (rest && rest.beeped) endRest(false); }, 6000);
  }
}
function endRest(rerender) {
  clearInterval(restTick); rest = null;
  $('#rest').classList.remove('show', 'over'); document.body.classList.remove('has-rest');
  if (rerender && inFocus()) { render(); window.scrollTo(0, 0); }
}
$('#restSkip').onclick = () => endRest(true);
$('#restPlus').onclick = () => adjustRest(15);
$('#restMinus').onclick = () => adjustRest(-15);

function elapsedTxt(short) {
  if (!S.active) return '';
  const t = fmtTime(Math.floor((Date.now() - S.active.start) / 1000));
  return short ? t : `${t} · ${progressPct()}%`;
}
setInterval(() => { const el = $('#elapsed'); if (el && S.active) el.textContent = elapsedTxt(); }, 1000);


/* ============================== Resumo do treino ============================== */
let summaryEnd = null;
function bestSet(e, ss) {
  const m = metric(e); const by = (f) => ss.reduce((b, s) => (f(s) > f(b) ? s : b), ss[0]);
  if (m === 'time' || (e.bodyweight && !ss.some(s => s.kg))) return by(s => s.reps || 0);
  if (m === 'dist') return by(s => s.kg || 0);
  if (e.assist) return by(s => -(s.kg || 0) * 1000 + (s.reps || 0));
  return by(s => (s.kg || 0) * 1000 + (s.reps || 0));
}
function cmpSet(e, a, b) {           // 1 = melhorou, 0 = igual, -1 = piorou
  if (!a || !b) return null;
  const m = metric(e); const sg = x => Math.sign(Math.round(x * 100));
  if (m === 'time' || (e.bodyweight && !a.kg && !b.kg)) return sg((a.reps || 0) - (b.reps || 0));
  if (m === 'dist') return sg((a.kg || 0) - (b.kg || 0));
  const dk = e.assist ? (b.kg || 0) - (a.kg || 0) : (a.kg || 0) - (b.kg || 0);
  return dk ? sg(dk) : sg((a.reps || 0) - (b.reps || 0));
}
function summaryData(h) {
  const prev = S.history.filter(x => x.end < h.end);
  const prevSame = [...prev].reverse().find(x => x.plan === h.plan) || null;
  const rows = [], prs = [];
  for (const e of exList(h)) {
    const ss = (h.sets[e.id] || []).filter(s => s.done); if (!ss.length) continue;
    const m = metric(e); const best = bestSet(e, ss);
    let pSess = null;
    for (let k = prev.length - 1; k >= 0; k--) { const x = (prev[k].sets[e.id] || []).filter(s => s.done); if (x.length) { pSess = x; break; } }
    const pBest = pSess ? bestSet(e, pSess) : null;
    rows.push({ e, best, pBest, cmp: cmpSet(e, best, pBest) });
    const all = prev.flatMap(x => (x.sets[e.id] || []).filter(s => s.done));
    if (!all.length || e.assist || m === 'dist') continue;
    if (m === 'time' || (e.bodyweight && !ss.some(s => s.kg))) {
      const pm = Math.max(...all.map(s => s.reps || 0)), tm = Math.max(...ss.map(s => s.reps || 0));
      if (tm > pm) prs.push({ e, text: m === 'time' ? `Recorde de tempo: ${tm} s (antes ${pm} s)` : `Recorde de repetições: ${tm} (antes ${pm})` });
      continue;
    }
    const pk = Math.max(...all.map(s => s.kg || 0)), tk = Math.max(...ss.map(s => s.kg || 0));
    if (tk > pk) { prs.push({ e, text: `Nova carga máxima: ${fmtKg(tk)} kg (antes ${fmtKg(pk)} kg)` }); continue; }
    const atK = all.filter(s => s.kg === tk);
    if (tk && atK.length) {
      const pr = Math.max(...atK.map(s => s.reps || 0)), tr = Math.max(...ss.filter(s => s.kg === tk).map(s => s.reps || 0));
      if (tr > pr) prs.push({ e, text: `Recorde de repetições com ${fmtKg(tk)} kg: ${tr} (antes ${pr})` });
    }
  }
  const sets = Object.values(h.sets).flat().filter(s => s.done).length;
  return { prev: prevSame, rows, prs, sets, vol: sessionVolume(h), pVol: prevSame ? sessionVolume(prevSame) : null,
    dur: Math.max(1, Math.round((h.end - h.start) / 60000)), pDur: prevSame ? Math.max(1, Math.round((prevSame.end - prevSame.start) / 60000)) : null };
}
function delta(cur, prev, neutral) {
  if (prev == null || !prev) return '';
  const d = cur - prev; if (!d) return '<span class="dl eq">= anterior</span>';
  const pct = Math.round(d / prev * 100); const good = d > 0;
  return `<span class="dl ${neutral ? 'eq' : good ? 'up' : 'down'}">${d > 0 ? '↑' : '↓'} ${Math.abs(pct)}%</span>`;
}
function viewSummary() {
  const h = S.history.find(x => x.end === summaryEnd); const p = PLANS[h.plan]; const d = summaryData(h);
  const ex = exList(h); const arrow = c => c == null ? '' : c > 0 ? '<span class="dl up">↑</span>' : c < 0 ? '<span class="dl down">↓</span>' : '<span class="dl eq">=</span>';
  const isLatest = S.history[S.history.length - 1] === h;
  return `<div class="wrap">
    <div class="done-ico">${CHECK}</div>
    <h1 style="text-align:center">${p.name} concluído</h1>
    <p class="muted" style="text-align:center;margin-top:0">${new Date(h.end).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <div class="stats">
      <div class="stat"><b>${d.dur} min</b><span>duração</span>${delta(d.dur, d.pDur, true)}</div>
      <div class="stat"><b>${d.sets}</b><span>séries</span></div>
      <div class="stat"><b>${d.vol.toLocaleString('pt-BR')}</b><span>kg de volume</span>${delta(d.vol, d.pVol)}</div>
    </div>
    ${d.prs.length ? `<h2>★ Recordes do dia</h2><div class="card pr-card">${d.prs.map(r => `<div class="kv"><span>${esc(r.e.name)}</span><b>${esc(r.text)}</b></div>`).join('')}</div>` : ''}
    <h2>${d.prev ? `Comparado ao ${p.name} de ${fmtDate(d.prev.end)}` : 'Melhor série de cada exercício'}</h2>
    <div class="card">
      ${d.rows.map(r => `<div class="cmp-row"><div class="cmp-name">${esc(r.e.name)}</div>
        <div class="cmp-vals"><b>${fmtSet(r.e, r.best)}</b> ${arrow(r.cmp)}${r.pBest ? `<span class="muted small">antes ${fmtSet(r.e, r.pBest)}</span>` : '<span class="muted small">primeira vez</span>'}</div></div>`).join('') || '<div class="muted">Nenhuma série registrada.</div>'}
    </div>
    ${(h.skipped || []).length ? `<p class="note">Pulados: ${h.skipped.map(i => esc(ex[i].name)).join(', ')}.</p>` : ''}
    ${h.cardio ? `<p class="note"><b style="color:var(--text)">Aeróbico:</b> ${esc(h.cardio.type)} · ${h.cardio.min} min${h.cardio.km ? ' · ' + fmtKg(h.cardio.km) + ' km' : ''} · ${esc(h.cardio.int)}</p>` : ''}
    ${!d.prev ? `<p class="note">Este é o seu primeiro ${p.name} registrado. Na próxima vez, o app compara cada exercício com hoje.</p>` : ''}
    ${isLatest ? backupCard() : ''}
    ${isLatest ? `<div class="card" style="margin-top:12px"><div class="muted small">Próximo treino</div><h3>${PLANS[S.next].name} · ${PLANS[S.next].focus}</h3></div>` : ''}
    <div class="stack" style="margin-top:12px"><button class="btn" data-goto="home">Concluir</button><button class="btn ghost" data-goto="history">Ver histórico</button></div>
  </div>`;
}


/* ============================== Backup ============================== */
function backupPending() { return S.history.length - ((S.backup && S.backup.count) || 0); }
function backupDue() {
  return S.backupEvery > 0 && backupPending() >= S.backupEvery && S.history.length > (S.backupSnooze || 0);
}
function backupCard() {
  if (!backupDue()) return '';
  const n = backupPending(); const last = S.backup && S.backup.at;
  return `<div class="card backup-card">
    <b>Hora de fazer backup</b>
    <div class="note" style="margin-top:4px">${last ? `${n} treinos desde o último backup (${fmtDate(last)}).` : `Você já tem ${n} treinos registrados e ainda não fez backup.`} Os dados ficam só neste iPhone: salve uma cópia no iCloud Drive ou no app Arquivos.</div>
    <div class="row" style="gap:8px;margin-top:12px"><button class="btn" data-backup style="flex:1">Fazer backup agora</button><button class="btn ghost" data-snooze style="width:auto">Depois</button></div>
  </div>`;
}
async function exportBackup() {
  const name = `treino-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const json = JSON.stringify(S, null, 2);
  const done = () => { S.backup = { at: Date.now(), count: S.history.length }; save(); render(); };
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup do treino' });   // no iPhone: "Salvar em Arquivos"
      return done();
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name; a.click(); done();
}

/* ============================== Eventos gerais ============================== */
function bind() {
  document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => startSession(b.dataset.start));
  document.querySelectorAll('[data-hist]').forEach(c => c.onclick = () => c.classList.toggle('open'));
  document.querySelectorAll('[data-sum]').forEach(b => b.onclick = ev => { ev.stopPropagation(); summaryEnd = +b.dataset.sum; go('summary'); });
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
  document.querySelectorAll('[data-backup]').forEach(b => b.onclick = exportBackup);
  document.querySelectorAll('[data-snooze]').forEach(b => b.onclick = () => { S.backupSnooze = S.history.length; save(); render(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    if (!confirm('Excluir este treino do histórico?')) return;
    S.history = S.history.filter(h => String(h.end) !== b.dataset.del); save(); render();
  });
  const ch = $('#clearHist');
  if (ch) ch.onclick = () => { if (confirm('Excluir TODO o histórico de treinos? Essa ação não pode ser desfeita.')) { S.history = []; save(); render(); } };
  if (tab === 'profile') {
    const upd = () => {
      const p = S.profile;
      p.idade = num($('#pIdade').value) || p.idade; p.altura = num($('#pAltura').value) || p.altura;
      p.peso = num($('#pPeso').value) || p.peso; p.atividade = num($('#pAtiv').value) || p.atividade;
      save();
    };
    ['#pIdade', '#pAltura', '#pPeso'].forEach(s => $(s).addEventListener('change', () => { upd(); render(); }));
    $('#pAtiv').onchange = () => { upd(); render(); };
    $('#exportBtn').onclick = exportBackup;
    $('#bkEvery').onchange = ev => { S.backupEvery = +ev.target.value; save(); };
    $('#importIn').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return;
      f.text().then(t => { const d = JSON.parse(t); if (!d.history) throw 0; S = Object.assign(structuredClone(DEFAULT), d); save(); alert('Backup importado.'); render(); })
        .catch(() => alert('Arquivo inválido.'));
    };
    $('#resetBtn').onclick = () => { if (confirm('Apagar histórico, cargas e perfil? Essa ação não pode ser desfeita.')) { S = structuredClone(DEFAULT); save(); render(); } };
  }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

if (S.active) tab = 'home';
render();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
