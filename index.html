<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Full Body</title>
<meta name="description" content="Treinos full body A, B e C com registro de cargas e timer de descanso.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #20242d;
    --line: #2c313c;
    --text: #eef0f4;
    --muted: #9aa1ad;
    --accent: #3ddc97;
    --accent-ink: #06291a;
    --a: #3ddc97;
    --b: #5aa9ff;
    --c: #ffb547;
    --danger: #ff6b6b;
    --radius: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-top: var(--safe-t);
    padding-bottom: calc(76px + var(--safe-b));
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 8px 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 24px 0 12px; letter-spacing: -0.01em; }
  h3 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .tag {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px; font-weight: 800; font-size: 18px;
    color: #0b0d10; flex: none;
  }
  .tag.A { background: var(--a); } .tag.B { background: var(--b); } .tag.C { background: var(--c); }
  .btn {
    display: block; width: 100%; padding: 15px 18px; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; text-align: center;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid #4a2a2e; }
  .btn:active { transform: scale(.98); }
  .hero { padding: 20px; background: linear-gradient(160deg, #1d2a24, var(--surface) 70%); }
  .hero.B { background: linear-gradient(160deg, #1b2534, var(--surface) 70%); }
  .hero.C { background: linear-gradient(160deg, #2e2619, var(--surface) 70%); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .ex-list { list-style: none; padding: 0; margin: 12px 0 0; }
  .ex-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .ex-list li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Sessão */
  .session-head {
    position: sticky; top: 0; z-index: 5; background: rgba(15,17,21,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(10px + var(--safe-t)) 16px 10px; margin-top: calc(-1 * var(--safe-t));
    border-bottom: 1px solid var(--line);
  }
  .session-head .inner { max-width: 560px; margin: 0 auto; }
  .progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .ex { padding: 0; overflow: hidden; }
  .ex-top { padding: 16px; }
  .ex-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .tip { font-size: 14px; color: var(--muted); margin-top: 10px; display: none; }
  .ex.open .tip { display: block; }
  .tip-toggle { font-size: 13px; color: var(--b); margin-top: 8px; padding: 0; }
  .sets { border-top: 1px solid var(--line); }
  .set {
    display: grid; grid-template-columns: 34px 1fr 1fr 52px; gap: 8px; align-items: center;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
  }
  .set:last-child { border-bottom: 0; }
  .set-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 10px; padding-bottom: 4px; }
  .set .n { color: var(--muted); font-weight: 700; text-align: center; }
  .set input {
    width: 100%; min-width: 0; padding: 10px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--line); text-align: center; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .set input:focus { outline: 2px solid var(--b); outline-offset: -1px; }
  .check {
    width: 44px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
    display: grid; place-items: center; justify-self: end;
  }
  .check svg { width: 20px; height: 20px; stroke: var(--muted); }
  .set.done { background: rgba(61,220,151,.07); }
  .set.done .check { background: var(--accent); border-color: var(--accent); }
  .set.done .check svg { stroke: var(--accent-ink); }
  .last { font-size: 12px; color: var(--muted); }

  /* Timer de descanso */
  .rest {
    position: fixed; left: 12px; right: 12px; bottom: calc(84px + var(--safe-b)); z-index: 20;
    max-width: 536px; margin: 0 auto; background: #232833; border: 1px solid #3a4150; border-radius: 18px;
    padding: 12px 14px; display: none; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .rest.show { display: flex; }
  .rest .time { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 82px; }
  .rest .lbl { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.3; }
  .rest button { padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .rest.over .time { color: var(--accent); }

  /* Navegação */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(15,17,21,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
  }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav.tabs button { padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { color: var(--accent); }

  .hist-item .row { align-items: flex-start; }
  .hist-sets { font-size: 13px; color: var(--muted); margin-top: 8px; display: none; }
  .hist-item.open .hist-sets { display: block; }
  .hist-sets div { padding: 3px 0; }
  .empty { text-align: center; padding: 32px 16px; color: var(--muted); }
  .field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .field:first-child { border-top: 0; }
  .field input { padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); text-align: center; width: 100%; }
  .kv { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kv:first-child { border-top: 0; }
  .kv b { font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; color: var(--muted); }
  .hidden { display: none !important; }
  .tcell { display: flex; gap: 6px; min-width: 0; }
  .tcell input { flex: 1; }
  .play { width: 40px; flex: none; border-radius: 10px; background: var(--b); display: grid; place-items: center; }
  .play svg { width: 18px; height: 18px; fill: #06182b; }
  .set.timed { grid-template-columns: 34px 0.8fr 1.4fr 52px; }
  .set.running { background: rgba(90,169,255,.10); }
  .set.running .play { background: var(--danger); }
  .set.running input[data-f="reps"] { color: var(--b); font-weight: 800; }
  .set.running.hit input[data-f="reps"] { color: var(--accent); }
  .set.done .play { opacity: .35; }
  .cardio.off .cardio-body { display: none; }
  .cardio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .cardio-grid label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  .cardio-grid input, .cardio-grid select { width: 100%; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); font-size: 16px; }
  .switch { width: 50px; height: 30px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: .2s; }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { left: 23px; background: #fff; }
  .del-btn { margin-top: 12px; padding: 8px 12px; border-radius: 10px; font-size: 14px; color: var(--danger); border: 1px solid #4a2a2e; }
  .stack > * + * { margin-top: 10px; }
</style>
</head>
<body>

<div id="app"></div>

<div class="rest" id="rest" role="status" aria-live="polite">
  <div class="time" id="restTime">0:00</div>
  <div class="lbl" id="restLbl">Descanso</div>
  <button id="restPlus">+15s</button>
  <button id="restSkip">Pular</button>
</div>

<nav class="tabs" id="tabs">
  <div class="inner">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Início</button>
    <button data-tab="plans"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Treinos</button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
  </div>
</nav>

<script>
/* ============================================================
   PLANO DE TREINO — 3 treinos full body, 6 exercícios cada
   A: Força (cargas altas, poucas repetições)
   B: Hipertrofia (volume moderado)
   C: Resistência / condicionamento (repetições altas, descanso curto)
   ============================================================ */
const PLANS = {
  A: {
    name: 'Treino A', focus: 'Força',
    desc: 'Movimentos básicos com cargas mais altas e descanso maior.',
    exercises: [
      { id: 'agachamento', name: 'Agachamento livre com barra', muscles: 'Quadríceps, glúteos, core', sets: 4, reps: '6–8', rest: 120,
        tip: 'Pés na largura dos ombros, desça até a coxa ficar paralela ao chão mantendo a coluna neutra e os joelhos alinhados com a ponta dos pés.' },
      { id: 'supino-reto', name: 'Supino reto com barra', muscles: 'Peitoral, tríceps, ombro anterior', sets: 4, reps: '6–8', rest: 120,
        tip: 'Escápulas retraídas e pés firmes no chão. Desça a barra até a linha do peito, com cotovelos a ~45° do tronco.' },
      { id: 'remada-curvada', name: 'Remada curvada com barra', muscles: 'Dorsais, trapézio, bíceps', sets: 4, reps: '6–8', rest: 120,
        tip: 'Tronco inclinado a ~45°, coluna neutra. Puxe a barra em direção ao umbigo, apertando as escápulas.' },
      { id: 'desenvolvimento', name: 'Desenvolvimento com halteres', muscles: 'Ombros, tríceps', sets: 3, reps: '8–10', rest: 90,
        tip: 'Sentado com encosto, empurre os halteres acima da cabeça sem arquear a lombar.' },
      { id: 'stiff', name: 'Stiff com barra', muscles: 'Posteriores de coxa, glúteos, lombar', sets: 3, reps: '8–10', rest: 90,
        tip: 'Joelhos levemente flexionados, leve o quadril para trás e desça a barra rente às pernas até sentir alongar o posterior.' },
      { id: 'prancha', name: 'Prancha abdominal', muscles: 'Core', sets: 3, reps: '40s', rest: 60, unit: 's',
        tip: 'Antebraços no chão, corpo em linha reta da cabeça aos calcanhares. Contraia abdômen e glúteos.' },
    ]
  },
  B: {
    name: 'Treino B', focus: 'Hipertrofia',
    desc: 'Volume moderado, controle do movimento e foco na contração.',
    exercises: [
      { id: 'terra', name: 'Levantamento terra', muscles: 'Posteriores, glúteos, lombar, costas', sets: 3, reps: '6–8', rest: 120,
        tip: 'Barra próxima à canela, coluna neutra. Empurre o chão com os pés e estenda quadril e joelhos juntos.' },
      { id: 'supino-inclinado', name: 'Supino inclinado com halteres', muscles: 'Peitoral superior, ombros, tríceps', sets: 3, reps: '8–12', rest: 90,
        tip: 'Banco a 30°. Desça os halteres de forma controlada (2–3 s) e suba sem bater um no outro.' },
      { id: 'puxada', name: 'Puxada frontal (pulldown)', muscles: 'Dorsais, bíceps', sets: 3, reps: '10–12', rest: 90,
        tip: 'Pegada um pouco mais larga que os ombros. Puxe a barra até o alto do peito, levando os cotovelos para baixo.' },
      { id: 'bulgaro', name: 'Agachamento búlgaro', muscles: 'Quadríceps, glúteos', sets: 3, reps: '10 cada perna', rest: 90,
        tip: 'Pé de trás apoiado no banco. Desça até o joelho de trás quase tocar o chão, tronco levemente inclinado.' },
      { id: 'elevacao-lateral', name: 'Elevação lateral com halteres', muscles: 'Ombro lateral', sets: 3, reps: '12–15', rest: 60,
        tip: 'Cotovelos levemente flexionados, eleve até a altura dos ombros sem balançar o tronco.' },
      { id: 'rosca-triceps', name: 'Rosca direta + tríceps corda (bi-set)', muscles: 'Bíceps, tríceps', sets: 3, reps: '12 + 12', rest: 60,
        tip: 'Faça a rosca e, sem descanso, o tríceps na polia. Registre a carga da rosca no campo kg.' },
    ]
  },
  C: {
    name: 'Treino C', focus: 'Resistência',
    desc: 'Repetições mais altas e descanso curto para condicionamento.',
    exercises: [
      { id: 'leg-press', name: 'Leg press 45°', muscles: 'Quadríceps, glúteos', sets: 3, reps: '12–15', rest: 60,
        tip: 'Pés no meio da plataforma, desça até ~90° de joelho sem tirar a lombar do encosto.' },
      { id: 'barra-fixa', name: 'Barra fixa (ou graviton)', muscles: 'Dorsais, bíceps', sets: 3, reps: 'máx.', rest: 60,
        tip: 'Se ainda não fizer 6 repetições livres, use o graviton/elástico. No graviton, registre o contrapeso em kg.' },
      { id: 'flexao', name: 'Flexão de braço', muscles: 'Peitoral, tríceps, core', sets: 3, reps: '12–20', rest: 60, bodyweight: true,
        tip: 'Mãos um pouco mais abertas que os ombros, corpo alinhado. Se necessário, apoie as mãos num banco.' },
      { id: 'mesa-flexora', name: 'Mesa flexora', muscles: 'Posteriores de coxa', sets: 3, reps: '12–15', rest: 60,
        tip: 'Quadril colado no banco; flexione os joelhos com controle e segure 1 s no topo.' },
      { id: 'remada-unilateral', name: 'Remada unilateral com halter', muscles: 'Dorsais, romboides', sets: 3, reps: '12 cada lado', rest: 60,
        tip: 'Mão e joelho apoiados no banco. Puxe o halter em direção ao quadril, sem girar o tronco.' },
      { id: 'farmer', name: 'Caminhada do fazendeiro', muscles: 'Antebraço, trapézio, core', sets: 3, reps: '40 m', rest: 60,
        tip: 'Um halter pesado em cada mão, ombros para trás, passos curtos e firmes. Registre o peso de cada halter.' },
    ]
  }
};
const ORDER = ['A', 'B', 'C'];

/* Aeróbico opcional ao final do treino */
const CARDIO_TYPES = ['Esteira', 'Bicicleta', 'Elíptico', 'Escada', 'Remo', 'Corda', 'Caminhada/corrida na rua'];
const CARDIO_INT = ['Leve', 'Moderado', 'Intenso', 'HIIT (intervalado)'];
const CARDIO_SUG = {
  A: { min: 20, int: 'Moderado', txt: '15–20 min em ritmo moderado (dá para conversar com alguma dificuldade). Ex.: esteira inclinada ou bicicleta.' },
  B: { min: 20, int: 'Moderado', txt: '15–20 min em ritmo leve a moderado, para não prejudicar a recuperação do treino de hipertrofia.' },
  C: { min: 12, int: 'HIIT (intervalado)', txt: '10–15 min intervalado: 30 s forte + 60 s leve, repetindo de 8 a 10 vezes. Ex.: bicicleta ou remo.' },
};

/* ============================== Armazenamento ============================== */
const KEY = 'treino-fullbody-v1';
const DEFAULT = { next: 'A', history: [], last: {}, active: null,
  profile: { sexo: 'M', idade: 32, altura: 178, peso: 79, atividade: 1.55 } };
let S;
try { S = Object.assign(structuredClone(DEFAULT), JSON.parse(localStorage.getItem(KEY)) || {}); }
catch (e) { S = structuredClone(DEFAULT); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ============================== Utilidades ============================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.max(0, sec) % 60).padStart(2, '0')}`;
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

function weekCount() {
  const now = new Date(); const d = new Date(now); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // segunda-feira
  return S.history.filter(h => h.end >= d.getTime()).length;
}
function sessionVolume(h) {
  let v = 0;
  for (const id in h.sets) for (const s of h.sets[id]) if (s.done && s.kg && s.reps) v += s.kg * s.reps;
  return Math.round(v);
}

/* ============================== Telas ============================== */
let tab = 'home';
function go(t) { if (sw) stopWatch(false); tab = t; render(); window.scrollTo(0, 0); }

function render() {
  const app = $('#app');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'session' && S.active) { app.innerHTML = viewSession(); bindSession(); return; }
  if (tab === 'session') tab = 'home';
  app.innerHTML = { home: viewHome, plans: viewPlans, history: viewHistory, profile: viewProfile }[tab]();
  bind();
}

function planList(k) {
  return `<ul class="ex-list">${PLANS[k].exercises.map(e =>
    `<li><span>${esc(e.name)}</span><span>${e.sets} × ${esc(e.reps)}</span></li>`).join('')}</ul>`;
}

function viewHome() {
  const k = S.active ? S.active.plan : S.next; const p = PLANS[k];
  const last = S.history[S.history.length - 1];
  return `<div class="wrap">
    <p class="muted small" style="margin:8px 0 0">${new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <h1>Bora treinar, Lucas</h1>
    <div class="card hero ${k}" style="margin-top:16px">
      <div class="row"><span class="tag ${k}">${k}</span>
        <div><div class="muted small">${S.active ? 'Treino em andamento' : 'Próximo treino'}</div><h3>${p.name} · ${p.focus}</h3></div></div>
      ${planList(k)}
      <button class="btn" style="margin-top:16px" data-start="${k}">${S.active ? 'Continuar treino' : 'Começar ' + p.name}</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${weekCount()}</b><span>nesta semana</span></div>
      <div class="stat"><b>${S.history.length}</b><span>treinos no total</span></div>
      <div class="stat"><b>${last ? last.plan : '—'}</b><span>último treino</span></div>
    </div>
    <h2>Como funciona</h2>
    <div class="card note stack">
      <div>Alterne os treinos na sequência <b>A → B → C</b>, com pelo menos um dia de descanso entre eles (ex.: seg, qua, sex).</div>
      <div>Ao marcar uma série como feita, o cronômetro de descanso começa sozinho.</div>
      <div><b>Progressão:</b> quando conseguir fazer todas as séries no topo da faixa de repetições, aumente a carga em 2–5%.</div>
    </div>
  </div>`;
}

function viewPlans() {
  return `<div class="wrap"><h1>Treinos</h1><p class="muted">3 treinos full body · 6 exercícios cada</p>
    ${ORDER.map(k => `<div class="card">

function viewHistory() {

function calcProfile() {
  const p = S.profile; const h = p.altura / 100;
  const imc = p.peso / (h * h);
  const tmb = 10 * p.peso + 6.25 * p.altura - 5 * p.idade + (p.sexo === 'M' ? 5 : -161); // Mifflin-St Jeor
  return { imc, tmb, get: tmb * p.atividade, protMin: p.peso * 1.6, protMax: p.peso * 2.2, agua: p.peso * 35 };
}
function imcClass(v) { return v < 18.5 ? 'abaixo do peso' : v < 25 ? 'faixa normal' : v < 30 ? 'sobrepeso' : 'obesidade'; }

function viewProfile() {
  const p = S.profile; const c = calcProfile();

      <button class="btn danger" id="resetBtn">Apagar todos os dados</button>

}

/* ============================== Sessão de treino ============================== */
function startSession(k) {
  if (S.active && S.active.plan !== k) {
    if (!confirm(`Há um ${PLANS[S.active.plan].name} em andamento. Descartar e iniciar o ${PLANS[k].name}?`)) return;
    S.active = null;
  }
  if (!S.active) {
    const sets = {};
    for (const e of PLANS[k].exercises) {
      const last = S.last[e.id] || {};
      sets[e.id] = Array.from({ length: e.sets }, () => ({ kg: last.kg ?? null, reps: null, done: false }));
    }
    S.active = { plan: k, start: Date.now(), sets, cardio: newCardio(k) };
    save();
  }
  go('session');
}

function newCardio(k) {
  const prev = S.lastCardio || {};
  return { on: false, type: prev.type || 'Esteira', min: CARDIO_SUG[k].min, km: null, int: CARDIO_SUG[k].int };
}

function viewCardio(a) {
  const c = a.cardio; const sug = CARDIO_SUG[a.plan];
  const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  return `<div class="card cardio ${c.on ? '' : 'off'}" id="cardio">
    <div class="row between">
      <div><h3>Aeróbico <span class="muted small" style="font-weight:400">(opcional)</span></h3>
        <div class="muted small">Faça depois da musculação</div></div>
      <button class="switch ${c.on ? 'on' : ''}" id="cardioSw" role="switch" aria-checked="${c.on}" aria-label="Incluir aeróbico"></button>
    </div>
    <div class="cardio-body">
      <div class="note" style="margin-top:10px"><b style="color:var(--text)">Sugestão:</b> ${esc(sug.txt)}</div>
      <div class="cardio-grid">
        <label>Modalidade<select data-c="type">${opt(CARDIO_TYPES, c.type)}</select></label>
        <label>Intensidade<select data-c="int">${opt(CARDIO_INT, c.int)}</select></label>
        <label>Tempo (min)<input data-c="min" inputmode="numeric" value="${c.min ?? ''}"></label>
        <label>Distância (km, opcional)<input data-c="km" inputmode="decimal" value="${c.km ?? ''}" placeholder="—"></label>
      </div>
      <button class="btn ghost" id="cardioTimer" style="margin-top:12px">Iniciar cronômetro de ${c.min || 0} min</button>
    </div>
  </div>`;
}

function progressPct() {
  let t = 0, d = 0;
  for (const id in S.active.sets) for (const s of S.active.sets[id]) { t++; if (s.done) d++; }
  return t ? Math.round(d / t * 100) : 0;
}

function viewSession() {
  const a = S.active; const p = PLANS[a.plan];
  if (!a.cardio) a.cardio = newCardio(a.plan);
  const cards = p.exercises.map((e, ei) => {
    const last = S.last[e.id];
    const lastTxt = last ? `Última vez: ${last.kg ?? '–'} kg × ${last.reps ?? '–'}` : 'Primeira vez neste exercício';
    const rows = a.sets[e.id].map((s, si) => `
      <div class="set ${e.unit === 's' ? 'timed' : ''} ${s.done ? 'done' : ''}" data-ex="${e.id}" data-i="${si}">
        <div class="n">${si + 1}</div>
        <input inputmode="decimal" placeholder="${e.bodyweight ? 'peso corp.' : 'kg'}" value="${s.kg ?? ''}" data-f="kg" aria-label="Carga série ${si + 1}">
        ${e.unit === 's'
          ? `<div class="tcell"><input inputmode="numeric" placeholder="seg" value="${s.reps ?? ''}" data-f="reps" aria-label="Segundos série ${si + 1}"><button class="play" data-play aria-label="Cronometrar série ${si + 1}">${PLAY}</button></div>`
          : `<input inputmode="numeric" placeholder="${esc(e.reps)}" value="${s.reps ?? ''}" data-f="reps" aria-label="Repetições série ${si + 1}">`}
        <button class="check" data-done aria-label="Marcar série ${si + 1} como feita">${CHECK}</button>
      </div>`).join('');
    return `<div class="card ex" id="ex-${e.id}">
      <div class="ex-top">
        <div class="row between" style="align-items:flex-start"><h3>${ei + 1}. ${esc(e.name)}</h3></div>
        <div class="muted small" style="margin-top:2px">${esc(e.muscles)}</div>
        <div class="ex-meta"><span class="pill">${e.sets} séries</span><span class="pill">${esc(e.reps)}</span><span class="pill">descanso ${fmtTime(e.rest)}</span></div>
        <div class="last" style="margin-top:8px">${lastTxt}</div>
        <button class="tip-toggle" data-tip>Como executar</button>
        <div class="tip">${esc(e.tip)}</div>
      </div>
      <div class="sets">
        <div class="set set-h ${e.unit === 's' ? 'timed' : ''}"><div>Série</div><div style="text-align:center">kg</div><div style="text-align:center">${e.unit === 's' ? 'seg' : 'reps'}</div><div></div></div>
        ${rows}
      </div>
    </div>`;
  }).join('');
  return `<div class="session-head"><div class="inner">
      <div class="row between">
        <div class="row"><span class="tag ${a.plan}" style="width:34px;height:34px;font-size:16px">${a.plan}</span>
          <div><h3>${p.name} · ${p.focus}</h3><div class="muted small" id="elapsed">0:00</div></div></div>
        <button class="btn ghost" style="width:auto;padding:8px 14px;font-size:15px" id="backBtn">Sair</button>
      </div>
      <div class="progress"><i id="prog" style="width:${progressPct()}%"></i></div>
    </div></div>
    <div class="wrap">${cards}
      ${viewCardio(a)}
      <button class="btn" id="finishBtn" style="margin-top:8px">Finalizar treino</button>
      <button class="btn danger" id="discardBtn" style="margin-top:10px">Descartar treino</button>
    </div>`;
}

function bindSession() {
  const a = S.active;
  $('#backBtn').onclick = () => go('home');
  $('#finishBtn').onclick = finishSession;
  $('#cardioSw').onclick = () => {
    a.cardio.on = !a.cardio.on; save();
    $('#cardio').classList.toggle('off', !a.cardio.on);
    $('#cardioSw').classList.toggle('on', a.cardio.on); $('#cardioSw').setAttribute('aria-checked', a.cardio.on);
  };
  document.querySelectorAll('[data-c]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    const f = el.dataset.c; a.cardio[f] = (f === 'min' || f === 'km') ? num(el.value) : el.value;
    if (f === 'min') $('#cardioTimer').textContent = `Iniciar cronômetro de ${a.cardio.min || 0} min`;
    save();
  }));
  $('#cardioTimer').onclick = () => { if (a.cardio.min) startRest(a.cardio.min * 60, `Aeróbico · ${a.cardio.type}`); };
  $('#discardBtn').onclick = () => { if (confirm('Descartar este treino? Nada será salvo.')) { S.active = null; save(); stopRest(); go('home'); } };
  document.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => {
    const c = b.closest('.ex'); c.classList.toggle('open'); b.textContent = c.classList.contains('open') ? 'Ocultar dica' : 'Como executar';
  });
  document.querySelectorAll('.set[data-ex]').forEach(row => {
    const id = row.dataset.ex, i = +row.dataset.i; const s = a.sets[id][i];
    row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
      s[inp.dataset.f] = num(inp.value);
      // repete a carga nas séries seguintes ainda não feitas
      if (inp.dataset.f === 'kg') a.sets[id].forEach((o, j) => {
        if (j > i && !o.done) { o.kg = s.kg; const el = $(`.set[data-ex="${id}"][data-i="${j}"] input[data-f="kg"]`); if (el) el.value = s.kg ?? ''; }
      });
      save();
    }));
    const ex = PLANS[a.plan].exercises.find(e => e.id === id);
    const play = $('[data-play]', row);
    if (play) play.onclick = () => {
      if (sw && sw.row === row) return stopWatch(true);
      if (s.done) return;
      startWatch(row, s, parseInt(ex.reps, 10), () => toggleDone());
    };
    $('[data-done]', row).onclick = () => { if (sw && sw.row === row) return stopWatch(true); toggleDone(); };
    function toggleDone() {
      s.done = !s.done;
      if (s.done && s.reps == null) {
        const def = parseInt(ex.reps, 10); // usa o início da faixa como padrão
        if (!isNaN(def)) { s.reps = def; $('input[data-f="reps"]', row).value = def; }
      }
      row.classList.toggle('done', s.done);
      $('#prog').style.width = progressPct() + '%';
      save();
      if (s.done) {
        if (navigator.vibrate) navigator.vibrate(30);
        const allDone = a.sets[id].every(x => x.done);
        const idx = PLANS[a.plan].exercises.indexOf(ex); const nxt = PLANS[a.plan].exercises[idx + 1];
        startRest(ex.rest, allDone ? (nxt ? `Próximo: ${nxt.name}` : 'Último exercício concluído!') : `${ex.name} · série ${i + 2}`);
      }
    }
  });
}

function finishSession() {
  const a = S.active; const doneCount = Object.values(a.sets).flat().filter(s => s.done).length;
  if (!doneCount && !(a.cardio && a.cardio.on) && !confirm('Nenhuma série foi marcada. Finalizar mesmo assim?')) return;
  for (const id in a.sets) {
    const done = a.sets[id].filter(s => s.done);
    if (done.length) { const best = done.reduce((m, s) => (s.kg ?? 0) >= (m.kg ?? 0) ? s : m, done[0]); S.last[id] = { kg: best.kg, reps: best.reps }; }
  }
  const cardio = a.cardio && a.cardio.on && a.cardio.min ? { type: a.cardio.type, min: a.cardio.min, km: a.cardio.km, int: a.cardio.int } : null;
  if (cardio) S.lastCardio = { type: cardio.type };
  S.history.push({ plan: a.plan, start: a.start, end: Date.now(), sets: a.sets, cardio });
  S.next = ORDER[(ORDER.indexOf(a.plan) + 1) % 3];
  S.active = null; save(); stopRest();
  alert(`Treino concluído! ${doneCount} séries registradas. Próximo: ${PLANS[S.next].name}.`);
  go('history');
}

/* ============================== Cronômetro de exercício (ex.: prancha) ============================== */
let sw = null; // { row, s, start, tick, target, hit, onDone }
function tone(freq, dur = 0.15) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); const t = audioCtx.currentTime;
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function startWatch(row, s, target, onDone) {
  if (sw) stopWatch(true);           // só um cronômetro por vez
  stopRest();
  const inp = $('input[data-f="reps"]', row), btn = $('[data-play]', row);
  sw = { row, s, target, onDone, hit: false, start: Date.now() + 3000 };   // 3 s para se posicionar
  row.classList.add('running'); btn.innerHTML = STOP; btn.setAttribute('aria-label', 'Parar cronômetro');
  let lastCount = null;
  const upd = () => {
    const ms = Date.now() - sw.start;
    if (ms < 0) {                    // contagem regressiva 3-2-1
      const c = Math.ceil(-ms / 1000);
      if (c !== lastCount) { lastCount = c; tone(660); }
      inp.value = ''; inp.placeholder = `em ${c}…`; return;
    }
    if (lastCount !== 0) { lastCount = 0; tone(990, 0.3); }
    const sec = Math.floor(ms / 1000); inp.value = sec;
    if (!sw.hit && target && sec >= target) { sw.hit = true; row.classList.add('hit'); beep(); }
  };
  upd(); sw.tick = setInterval(upd, 200);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { if (sw) sw.lock = l; else l.release(); }).catch(() => {}); } catch (e) {}
}
function stopWatch(record) {
  if (!sw) return;
  const { row, s, onDone, tick } = sw; clearInterval(tick);
  try { sw.lock && sw.lock.release(); } catch (e) {}
  const sec = Math.max(0, Math.floor((Date.now() - sw.start) / 1000));
  const inp = $('input[data-f="reps"]', row), btn = $('[data-play]', row);
  row.classList.remove('running', 'hit'); inp.placeholder = 'seg';
  if (btn) { btn.innerHTML = PLAY; btn.setAttribute('aria-label', 'Cronometrar série'); }
  const started = Date.now() >= sw.start; sw = null;
  if (record && started && sec > 0) { s.reps = sec; inp.value = sec; save(); if (!s.done) onDone(); }
  else { inp.value = s.reps ?? ''; }
}

/* ============================== Timer de descanso ============================== */
let restEnd = 0, restTick = null, beeped = false, audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startRest(sec, label) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  restEnd = Date.now() + sec * 1000; beeped = false;
  $('#restLbl').textContent = label; $('#rest').classList.add('show'); $('#rest').classList.remove('over');
  clearInterval(restTick); restTick = setInterval(updateRest, 250); updateRest();
}
function updateRest() {
  const left = Math.round((restEnd - Date.now()) / 1000);
  if (left <= 0) {
    $('#restTime').textContent = '0:00'; $('#rest').classList.add('over');
    if (!beeped) { beeped = true; beep(); $('#restLbl').textContent = 'Descanso finalizado — próxima série!'; setTimeout(stopRest, 6000); }
    return;
  }
  $('#restTime').textContent = fmtTime(left);
}
function stopRest() { clearInterval(restTick); $('#rest').classList.remove('show'); }
$('#restSkip').onclick = stopRest;
$('#restPlus').onclick = () => { restEnd += 15000; if (beeped) { beeped = false; $('#rest').classList.remove('over'); clearInterval(restTick); restTick = setInterval(updateRest, 250); } updateRest(); };

setInterval(() => { const el = $('#elapsed'); if (el && S.active) el.textContent = `${fmtTime(Math.floor((Date.now() - S.active.start) / 1000))} · ${progressPct()}% concluído`; }, 1000);

/* ============================== Eventos gerais ============================== */
function bind() {
  document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => startSession(b.dataset.start));
  document.querySelectorAll('[data-hist]').forEach(c => c.onclick = () => c.classList.toggle('open'));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    if (!confirm('Excluir este treino do histórico?')) return;
    S.history = S.history.filter(h => String(h.end) !== b.dataset.del); save(); render();
  });
  const ch = $('#clearHist');
  if (ch) ch.onclick = () => { if (confirm('Excluir TODO o histórico de treinos? Essa ação não pode ser desfeita.')) { S.history = []; save(); render(); } };
  if (tab === 'profile') {
    const upd = () => {
      const p = S.profile;
      p.idade = num($('#pIdade').value) || p.idade; p.altura = num($('#pAltura').value) || p.altura;
      p.peso = num($('#pPeso').value) || p.peso; p.atividade = num($('#pAtiv').value) || p.atividade;
      save();
    };
    ['#pIdade', '#pAltura', '#pPeso'].forEach(s => $(s).addEventListener('change', () => { upd(); render(); }));
    $('#pAtiv').onchange = () => { upd(); render(); };
    $('#exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `treino-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    };
    $('#importIn').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return;
      f.text().then(t => { const d = JSON.parse(t); if (!d.history) throw 0; S = Object.assign(structuredClone(DEFAULT), d); save(); alert('Backup importado.'); render(); })
        .catch(() => alert('Arquivo inválido.'));
    };
    $('#resetBtn').onclick = () => { if (confirm('Apagar histórico, cargas e perfil? Essa ação não pode ser desfeita.')) { S = structuredClone(DEFAULT); save(); render(); } };
  }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

if (S.active) tab = 'home';
render();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
